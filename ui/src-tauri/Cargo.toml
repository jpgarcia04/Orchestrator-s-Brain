[package]
name = "obrain-app"
version = "0.0.1"
description = "Orchestrator's Brain — la barra sobre el sustrato"
edition = "2024"
rust-version = "1.85"
license = "MIT"

# Workspace propio: el de `core/` es una biblioteca (ADR-0003) y la aplicación
# de escritorio no tiene por qué entrar en su árbol de compilación.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# La única dependencia de dominio. Todo lo que sabe esta aplicación del sistema
# entra por aquí: si algún comando de abajo tuviera lógica propia, sería lógica
# que el contestador de M7 tendría que volver a escribir.
obrain-api = { path = "../../core/obrain-api" }
obrain-core = { path = "../../core/obrain-core" }
tauri = { version = "2", features = [] }
# Las dos salidas hacia el archivo real: abrirlo con el programa del sistema y
# revelarlo en el explorador de Windows. Es la **única** ampliación de
# capacidades de la aplicación, se pidió explícitamente, y viene con un coste
# que se dice en pantalla y no sólo aquí: obrain es solo-lectura, pero el
# programa que abra el archivo no tiene por qué serlo.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
