<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orchestrator's Brain</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!--
      El orden del DOM es el argumento de ADR-0004: el mapa es el sustrato y
      va debajo; la barra flota encima. No son dos pantallas.
    -->
    <canvas id="sustrato"></canvas>

    <main id="barra">
      <input
        id="consulta"
        type="text"
        autocomplete="off"
        spellcheck="false"
        placeholder="¿Qué estás buscando?"
        aria-label="Buscar"
      />
      <div id="estado" aria-live="polite"></div>
      <ol id="resultados"></ol>
    </main>

    <!--
      El conmutador de EXPERIENCE.md §4.7. Visible y en un sitio fijo, porque el
      explorador **nunca aparece solo**: en el momento en que apareciera por
      tocar un nodo sería el modal que §4.4 prohíbe.
    -->
    <button id="conmutador" title="Explorador · Ctrl+E">explorador</button>

    <!--
      Centrado, grande y de tamaño fijo. Arrastrar y redimensionar están fuera
      de esta versión por escrito (ADR-0014): el valor está en poder bajar por la
      jerarquía sin escribir, y mover la ventana es acabado.
    -->
    <section id="explorador" tabindex="-1" hidden aria-label="Explorador">
      <header>
        <nav id="migas" aria-label="Ruta"></nav>
        <span class="pista">↑↓ moverse · → entrar · ← volver · Esc cerrar</span>
      </header>
      <div id="cuerpo">
        <div id="columnas"></div>
        <!--
          Donde vive el panel mientras el explorador está abierto. Es el mismo
          elemento que en la galaxia, reparentado: dos implementaciones del
          panel serían dos sitios donde arreglar el mismo fallo, y la
          consecuencia #4 de ADR-0014 —dos vistas de un solo estado— dejaría de
          ser cierta justo en la parte que se mira.
        -->
        <div id="detalle"></div>
      </div>
    </section>

    <!--
      El panel de EXPERIENCE.md §4.4, **con previsualización**. En la galaxia es
      un lateral y no un modal: perder el contexto espacial es perder el
      producto. Arranca aquí y `main` lo mueve al explorador cuando hace falta.
    -->
    <aside id="panel" hidden aria-label="Detalle"></aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
