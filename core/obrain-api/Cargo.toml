[package]
name = "obrain-api"
version = "0.0.1"
description = "La superficie del núcleo: buscar, mirar y recorrer — M5 de Orchestrator's Brain"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
obrain-core = { path = "../obrain-core" }
obrain-extract = { path = "../obrain-extract" }
obrain-embed = { path = "../obrain-embed" }
obrain-guard = { path = "../obrain-guard" }
# Los vencimientos: la etapa que los lee del texto y su lectura (ADR-0023).
obrain-expiry = { path = "../obrain-expiry" }
# El vigía de las bibliotecas (ADR-0024): `ReadDirectoryChangesW` en Windows,
# `inotify` en Linux, que es donde se prueba.
notify = "8"
# Sólo para reutilizar `label`: el nombre legible de una entidad ya se decide
# en M3 y no puede decidirse otra vez aquí.
obrain-link = { path = "../obrain-link" }
# Por `Availability`, y por nada más. Era dev-dependency mientras sólo hacía
# falta en un test; con la previsualización pasa a ser la guarda que decide si
# se abre un archivo, y **eso tiene que venir de donde M1 lo definió**. Copiar
# aquí las cuatro cadenas daría dos definiciones de lo mismo, y el día que
# discreparan se hidrataría un puntero de OneDrive sin que nadie lo notara.
obrain-scan = { path = "../obrain-scan" }
thiserror = "2"
# La llave de la base y la clave de recuperación (ADR-0021).
obrain-keys = { path = "../obrain-keys" }
# El OCR de Windows, para fotos y PDF escaneados (se lo pasa a M2 al indexar).
obrain-ocr = { path = "../obrain-ocr" }
# El hash del PIN: Argon2id, el mismo que deriva la clave de recuperación.
argon2 = "0.5"
getrandom = "0.3"
# Los tipos de salida cruzan a TypeScript tal cual. Es la alternativa a una
# capa de DTOs en el backend de Tauri que sería, palabra por palabra, estos
# mismos campos otra vez.
serde = { version = "1", features = ["derive"] }
# Sólo para que el CLI pueda volcar **exactamente** lo que recibe la interfaz.
# Es el mismo principio que `--sample` en M3: lo que no se puede inspeccionar no
# se puede depurar, y un mapa que sale mal se confunde con una decisión de
# diseño si no se puede mirar el dato que lo produjo.
serde_json = "1"
# La miniatura de M5b. Sin formatos por defecto: cada decodificador que entra
# se compila dentro del binario, y aquí sólo hacen falta los que produce una
# cámara o una captura de pantalla — que son el 100 % de las imágenes del
# corpus real y su región más grande (229 capturas).
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
] }
# La miniatura viaja como `data:` URI porque la alternativa —dejar que el
# webview leyera el archivo por su cuenta— pondría la guarda de la nube dentro
# de una ventana. Es el único uso de base64 en el proyecto.
base64 = "0.22"
